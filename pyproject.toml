[project]
name = "task-management-system"
version = "0.1.0"
description = "Production-style Task Management API built with FastAPI."
readme = "README.md"
requires-python = ">=3.13"

dependencies = [
    "fastapi>=0.116.1",
    "uvicorn>=0.35.0",
    "sqlalchemy>=2.0.41",
    "psycopg[binary]>=3.2.9",
    "pydantic-settings>=2.10.1",
    "email-validator>=2.3.0",
    "python-jose[cryptography]>=3.5.0",
    "passlib[bcrypt]>=1.7.4",
    "bcrypt>=4.1,<5.0",
    "httpx",
]

[dependency-groups]
dev = [
    "pytest>=8.4.1",
    "pytest-cov>=6.2.1",
    "ruff>=0.12.7",
    "black>=25.1.0",
    "mypy>=1.17.1",
]

[tool.ruff]
line-length = 88

[tool.black]
line-length = 88

[tool.mypy]
python_version = "3.13"
strict = false


[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]